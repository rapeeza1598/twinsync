[package]
name = "twinsync"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
eframe = "0.37.0"
egui_extras = "0.37.0"
globset = "0.4.21"
libc = "0.2.191"
notify = "8.2.2"
plist = "1.10.3"
rfd = "0.18.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
